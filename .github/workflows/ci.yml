name: Rust

on:
  # docs-only changes (README, screenshot, docs/) don't need a build
  push:
    branches: ["master"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: ["master"]
    paths-ignore: ["**.md", "docs/**"]

# One run at a time per branch/PR.
# - PRs: a new push cancels the running build (only the latest commit matters).
# - master: a running build/release always finishes; newer pushes wait, and only
#   the newest waiting run is kept (older waiting runs are cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: write-all

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get version
        id: get_version
        # $GITHUB_OUTPUT — a special environment variable that GitHub Actions automatically sets
        # for every step, pointing to a temporary file path (e.g. /tmp/some-random-file) unique
        # to that job run. Anything written to this file in the correct format becomes that step's
        # declared outputs.
        run: |
          VERSION=$(make version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    timeout-minutes: 20 # first run compiles every dependency (sqlx, tokio) twice: tests + release

    steps:
      - uses: actions/checkout@v4

      # Caches: reuse downloaded packages and compiled Rust dependencies between
      # runs, so only our own code is rebuilt (the macOS runner bills at ~10x).
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as local
          cache: yarn # keyed on yarn.lock

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri # caches src-tauri/target, keyed on Cargo.lock + rustc version

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Run tests
        run: make test

      - name: Set app version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          SEMVER=${VERSION#v}
          jq --arg v "$SEMVER" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          npm pkg set version="$SEMVER"

      - name: Build release binary
        id: build-release
        if: success()
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri build

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }} # stores asset inside folder matrix.os (ie. "macos-latest")
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.tar.gz.sig
          retention-days: 1 # only the release job needs it; the Release keeps its own copy

  release:
    # only pushes to master publish; PRs just build and test
    if: ${{ success() && github.event_name == 'push' }}
    needs: [version, build]
    runs-on: [ubuntu-latest]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      # What the installed app's updater reads (endpoint in tauri.conf.json):
      # the newest version, where to download it, and its signature.
      - name: Write latest.json
        env:
          TAG: ${{ needs.version.outputs.version }} # e.g. v0.1.7
          REPO: ${{ github.repository }} # cuongta/budget-app
        run: |
          # Read first: under `bash -e` a missing .sig fails here instead of
          # writing an empty signature.
          SIGNATURE=$(cat macos-latest/macos/budget-app.app.tar.gz.sig)
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$SIGNATURE" \
            --arg url "https://github.com/$REPO/releases/download/$TAG/budget-app.app.tar.gz" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $signature, url: $url }
              }
            }' > latest.json
          cat latest.json

      - name: Create Github Release and Upload Assets to Github
        id: create_gh_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body: |
            Released ${{ needs.version.outputs.version }}
          fail_on_unmatched_files: true # a missing file fails the release instead of a warning
          files: |
            macos-latest/dmg/*.dmg
            macos-latest/macos/budget-app.app.tar.gz
            latest.json
